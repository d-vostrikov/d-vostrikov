name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1C84FF&color_dots=#eef2f7,#c6dcf7,#8cbcf5,#4a97f2,#1C84FF
            dist/snake-dark.svg?color_snake=#1C84FF&color_dots=#161b22,#0f2a4d,#15427a,#1b62b3,#1C84FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
